spring:
  application:
    name: brokerage-api
  config:
    # .env holds the database connection; real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brokerage}
    username: ${DB_USERNAME:brokerage}
    password: ${DB_PASSWORD:brokerage}
  flyway:
    # The provided database is version 1: baselining it lets V2+ apply on top of it.
    baseline-on-migrate: true
    baseline-version: 1
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # A stable {content, page} body instead of the internal shape of PageImpl.
        serialization-mode: via-dto
  jackson:
    deserialization:
      # A share count of 1.5 is an error, not 1.
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns schema changes; Hibernate only validates them.
      ddl-auto: validate

app:
  # Filtered from the POM at build time so the OpenAPI document reports the project version.
  version: "@project.version@"

logging:
  pattern:
    correlation: '%replace([%X{requestId:-}] ){"\[\] ", ""}'

management:
  server:
    # Actuator is off the public port so metrics and probes are not reachable through the API's ingress.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
          show-components: always
