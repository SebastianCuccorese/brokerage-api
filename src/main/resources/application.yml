spring:
  application:
    name: brokerage-api
  config:
    # .env holds the database connection; real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brokerage}
    username: ${DB_USERNAME:brokerage}
    password: ${DB_PASSWORD:brokerage}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by the provided database; the app never creates or alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  # Filtered from the POM at build time so the OpenAPI document reports the project version.
  version: "@project.version@"

logging:
  pattern:
    correlation: '%replace([%X{requestId:-}] ){"\[\] ", ""}'

management:
  server:
    # Actuator is off the public port so metrics and probes are not reachable through the API's ingress.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
          show-components: always
