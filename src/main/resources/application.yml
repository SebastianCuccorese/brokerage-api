spring:
  application:
    name: brokerage-api
  config:
    # .env holds the database connection; real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brokerage}
    username: ${DB_USERNAME:brokerage}
    password: ${DB_PASSWORD:brokerage}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by the provided database; the app never creates or alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
