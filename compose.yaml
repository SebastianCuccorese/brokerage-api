services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: brokerage
      POSTGRES_USER: brokerage
      POSTGRES_PASSWORD: brokerage
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brokerage", "-d", "brokerage"]
      interval: 2s
      retries: 15
