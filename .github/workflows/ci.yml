name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sebastiancuccorese/brokerage-api
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  api:
    name: API collection (newman)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: brokerage
          POSTGRES_USER: brokerage
          POSTGRES_PASSWORD: brokerage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokerage -d brokerage"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: brokerage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Load the provided database state
        run: psql -h localhost -U brokerage -d brokerage -v ON_ERROR_STOP=1 -f db/01-database.sql
      - run: ./mvnw -B -DskipTests package
      - name: Start the API
        run: nohup java -jar target/brokerage-api-*.jar > app.log 2>&1 &
      - name: Wait until the API is ready
        run: |
          for _ in $(seq 60); do
            curl -sf --max-time 2 http://localhost:8081/actuator/health/readiness > /dev/null && exit 0
            sleep 1
          done
          cat app.log
          exit 1
      - name: Run the Postman collection
        run: >-
          docker run --rm --network host -v "$PWD/postman:/etc/newman"
          postman/newman:6-alpine run brokerage-api.postman_collection.json
          -e local.postman_environment.json
      - if: failure()
        run: cat app.log
